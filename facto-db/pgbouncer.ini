; facto-db: Postgres proxy to Neon. Contains no secrets and no upstream address.
; /run/facto-db/upstream.ini (mounted from /etc/exe-host/facto-db, written at runtime from 1Password by
; facto-db-config.sh, mode 0600, owned by the facto-db user) holds the [databases] entry and the credentials.
%include /run/facto-db/upstream.ini

[pgbouncer]
; Inside the container; compose publishes it on 127.0.0.1 only and `tailscale serve` exposes it as svc:facto-db.
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /run/facto-db/userlist.txt
; Session pooling: facto's sqlx pool uses prepared statements and session state; transaction pooling can break that.
pool_mode = session
max_client_conn = 100
default_pool_size = 10
; Neon requires TLS and SNI for the upstream host; pgbouncer sends the upstream host name as SNI.
server_tls_sslmode = verify-full
server_tls_ca_file = /etc/ssl/certs/ca-certificates.crt
; No TLS to clients: the tailnet (WireGuard) already encrypts that hop.
client_tls_sslmode = disable
ignore_startup_parameters = extra_float_digits,options
admin_users =
stats_users =
logfile =
pidfile =
