# Services on the host. One entry per service: image, loopback port, state under /srv/state/<name>.
# Services bind 127.0.0.1 only; reachability is added in services.d/<name>.sh with `tailscale serve`.
services:
  proof:
    build: ./proof
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /srv/state/proof:/state

  # Tokyo trip app backend, published as svc:tatami (services.d/tatami.sh). Keeps no state; reads/writes facto.
  # Source is pushed by the deploy-from-phobos job to /opt/exe-host/src/trip-projector/current (read-only here).
  # FACTO_URL comes from /etc/exe-host/tatami/env. UNTESTED. Host networking because projector.ts binds 127.0.0.1.
  tatami:
    image: oven/bun@sha256:87416c977a612a204eb54ab9f3927023c2a3c971f4f345a01da08ea6262ae30e # oven/bun:1.3.13
    profiles: ["tatami"]
    restart: unless-stopped
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    working_dir: /app
    command: ["bun", "projector.ts", "--api-only"]
    environment:
      TRIP_PORT: "8891"
    env_file: /etc/exe-host/tatami/env
    network_mode: host # projector.ts binds 127.0.0.1 (line 179); host net keeps it on the VM loopback only
    volumes:
      - /opt/exe-host/src/trip-projector/current:/app:ro

  # Option A: facto's Postgres on this host. Exclusive with facto-db below (both want 127.0.0.1:5432).
  # DB facto, role facto, loopback 5432, data /srv/state/facto-pg (uid 10003). Password: /etc/exe-host/facto-pg/password.
  # Image tag is NOT pinned by digest and the version must be >= phobos' (check `select version()` there).
  facto-pg:
    image: postgres:17
    profiles: ["facto-pg"]
    restart: unless-stopped
    user: "10003:10003"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: facto
      POSTGRES_USER: facto
      POSTGRES_PASSWORD_FILE: /run/facto-pg/password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /srv/state/facto-pg:/var/lib/postgresql/data
      - /etc/exe-host/facto-pg:/run/facto-pg:ro

  # Postgres proxy to Neon, published on the tailnet as svc:facto-db (services.d/facto-db.sh). Runs as its own
  # system user (uid 10001, `facto-db`), read-only, no capabilities. Starts only once /etc/exe-host/facto-db/
  # exists (bootstrap.sh sets COMPOSE_PROFILES=facto-db then); facto-db-config.sh writes it from 1Password.
  facto-db:
    build: ./facto-db
    profiles: ["facto-db"]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /etc/exe-host/facto-db:/run/facto-db:ro
