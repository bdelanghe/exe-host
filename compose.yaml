# Services on the host. One entry per service: image, loopback port, state under /srv/state/<name>.
# Services bind 127.0.0.1 only; reachability is added in services.d/<name>.sh with `tailscale serve`.
services:
  proof:
    build: ./proof
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /srv/state/proof:/state

  # Tokyo trip app backend, published as svc:tatami (services.d/tatami.sh). Keeps no state; reads/writes facto.
  # Source is pushed by the deploy-from-phobos job to /opt/exe-host/src/trip-projector/current (read-only here).
  # FACTO_URL comes from /etc/exe-host/tatami/env. UNTESTED: assumes projector.ts binds 0.0.0.0 inside the container.
  tatami:
    image: oven/bun@sha256:87416c977a612a204eb54ab9f3927023c2a3c971f4f345a01da08ea6262ae30e # oven/bun:1.3.13
    profiles: ["tatami"]
    restart: unless-stopped
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    working_dir: /app
    command: ["bun", "projector.ts", "--api-only"]
    environment:
      TRIP_PORT: "8891"
    env_file: /etc/exe-host/tatami/env
    ports:
      - "127.0.0.1:8891:8891"
    volumes:
      - /opt/exe-host/src/trip-projector/current:/app:ro

  # Postgres proxy to Neon, published on the tailnet as svc:facto-db (services.d/facto-db.sh). Runs as its own
  # system user (uid 10001, `facto-db`), read-only, no capabilities. Starts only once /etc/exe-host/facto-db/
  # exists (bootstrap.sh sets COMPOSE_PROFILES=facto-db then); facto-db-config.sh writes it from 1Password.
  facto-db:
    build: ./facto-db
    profiles: ["facto-db"]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /etc/exe-host/facto-db:/run/facto-db:ro
